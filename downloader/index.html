<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f0f1f4; --line:#e2e5ea; --line-2:#d2d6dd;
  --t-0:#1a1c22; --t-1:#555a66; --t-2:#8a909c;
  --acc:#3b6cf5; --acc-hover:#2f5be0; --acc-soft:#eaf0ff; --acc-line:#c5d6ff;
  --sh-1:0 1px 2px rgba(20,23,31,.04),0 2px 8px rgba(20,23,31,.05);
  --sh-2:0 8px 30px rgba(20,23,31,.10);
  --tr:180ms cubic-bezier(.2,.8,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t-0);min-height:100vh;}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:54px;
  background:var(--surface);position:relative;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
.brand-mark{width:30px;height:30px;border-radius:8px;box-shadow:var(--sh-1);}
.brand-title{font-size:18px;font-weight:800;letter-spacing:-0.01em;}
.tabbar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:6px;}
.tab-btn{padding:9px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--t-1);font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:7px;
  box-shadow:var(--sh-1);transition:var(--tr);white-space:nowrap;}
.tab-btn:hover{background:var(--surface-2);color:var(--t-0);}
.tab-btn.active{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc);box-shadow:none;}
main{max-width:860px;margin:0 auto;padding:72px 24px;}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:36px;}
.hero img{width:64px;height:64px;border-radius:16px;box-shadow:var(--sh-2);}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-0.02em;}
.hero p{color:var(--t-2);font-size:14px;margin-top:2px;}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:var(--sh-1);
  display:flex;flex-direction:column;gap:16px;transition:var(--tr);}
.card:hover{box-shadow:var(--sh-2);transform:translateY(-2px);}
.os{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;}
.os svg{width:26px;height:26px;fill:var(--t-0);}
.dl{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;border-radius:12px;
  background:var(--acc);color:#fff;font-weight:700;font-size:16px;text-decoration:none;transition:var(--tr);}
.dl:hover{background:var(--acc-hover);}
.dl:focus-visible,.guide:focus-visible,.tab-btn:focus-visible{outline:3px solid var(--acc-line);outline-offset:2px;}
.guide{color:var(--t-1);font-size:14px;text-decoration:none;text-align:center;padding:6px;border-radius:8px;}
.guide:hover{color:var(--acc);background:var(--acc-soft);}
.preview{margin:34px 0 0;}
.preview-cap{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13.5px;color:var(--t-1);}
.pv-badge{background:var(--t-0);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em;}
.preview{position:relative;}
.preview img{pointer-events:none;user-select:none;opacity:.96;}
.preview img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);box-shadow:var(--sh-2);background:#fff;}
.ver{margin-top:26px;color:var(--t-2);font-size:13px;text-align:center;}
@media (max-width:760px){
  .brand-title{display:none;}
  .tab-btn{padding:7px 10px;font-size:12px;}
  .cards{grid-template-columns:1fr;}
  main{padding:48px 18px;}
}
</style>
</head>
